name: Deploy to Hostinger

on:
  push:
    branches:
      - main # Triggers the workflow on push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Uses Node.js 20

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Deploy to Hostinger via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "145.79.9.108"
          port: 65002
          username: "u128908205"
          password: ${{ secrets.HOSTINGER_PASSWORD }} # Set this in GitHub Secrets (or replace with your password string if it's safe)
          source: "dist/*"
          target: "/home/u128908205/domains/alfayhasurvey.com/public_html"
          strip_components: 1 # This ensures the contents of `dist` are placed directly in `public_html` without creating a `dist` folder
